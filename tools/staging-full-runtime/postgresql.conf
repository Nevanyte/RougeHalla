# Host-only explicit cluster; pinned packaged PostgreSQL binaries are a required future release input.
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/rougehalla-postgres'
fsync = on
synchronous_commit = on
full_page_writes = on
password_encryption = 'scram-sha-256'
log_statement = 'none'
log_min_error_statement = 'panic'
max_connections = 32
