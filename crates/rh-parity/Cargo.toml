[package]
name = "rh-parity"
description = "Differential harness: replays captured legacy TypeScript scenarios through the Rust core and compares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rh-sim = { path = "../rh-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "parity-report"
path = "src/bin/parity_report.rs"

[lints]
workspace = true
