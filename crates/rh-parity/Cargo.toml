[package]
name = "rh-parity"
description = "Differential harness: replays captured legacy TypeScript scenarios through the Rust core and compares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rh-sim = { path = "../rh-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "parity-report"
path = "src/bin/parity_report.rs"

[lints]
workspace = true

[[bin]]
name = "parity-bench"
path = "src/bin/parity_bench.rs"

[dev-dependencies]
# The schedule conformance test reads the execution trace (tests/schedule.rs).
rh-sim = { path = "../rh-sim", features = ["schedule-trace"] }

[features]
trusted-status-probes = ["rh-sim/trusted-status-probes"]

[[bin]]
name = "status-probes"
path = "src/bin/status_probes.rs"
required-features = ["trusted-status-probes"]

[[bin]]
name = "hitbox-fixtures"
path = "src/bin/hitbox_fixtures.rs"

[[bin]]
name = "frost-wall-aim-fixtures"
path = "src/bin/frost_wall_aim_fixtures.rs"
