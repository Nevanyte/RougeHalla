[package]
name = "rh-placement"
description = "Capacity-aware, party-aware region placement for Roguehalla hosting: pure scoring, the GameLift placement request, hostnames, a fake backend. No AWS SDK, no game code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time", "rt", "macros", "net", "io-util", "sync"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "test-util", "macros", "rt", "rt-multi-thread", "sync"] }

[features]
default = []
# PostgreSQL-backed placement ledger (`ledger::postgres`). The default build never links sqlx or connects to a database.
postgres = ["dep:sqlx"]
# Named fault points and mutants for crash/negative-control tests (`ledger::faults`). Never enable in production.
fault-injection = []

[[bin]]
name = "rh-placement"
path = "src/bin/rh-placement.rs"

[lints]
workspace = true
