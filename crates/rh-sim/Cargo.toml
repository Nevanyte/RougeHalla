[package]
name = "rh-sim"
description = "Roguehalla authoritative simulation core: fixed-step, deterministic, no I/O, no wall clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust transcendental functions: identical results on every declared target (no platform libm differences).
libm = "0.2"
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# Records which ported rows of the tick schedule ran, in order (tests only: enabled by rh-parity as a dev-dependency
# feature, never in a production build). See src/schedule.rs.
schedule-trace = []

[lints]
workspace = true
