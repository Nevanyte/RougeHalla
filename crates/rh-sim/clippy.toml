# docs/adr/0007-determinism.md as a machine check (docs/CONTRACTS.md C-NUM / C-DET). `cargo clippy -D warnings` (CI) refuses:
#  * hash-ordered collections: their iteration order would make serialization, hashing and any loop nondeterministic;
#    use `Vec`, `BTreeMap` or `Store`;
#  * the platform-libm transcendentals of `f64` (results differ between targets): use `crate::math` (the `libm` crate);
#  * the wall clock.
# A sanctioned exception carries `#[allow(clippy::disallowed_methods)]` (or `disallowed_types`) with the reason beside it.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic: use Vec, BTreeMap or Store" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic: use Vec, BTreeSet or Store" },
    { path = "std::time::Instant", reason = "no wall clock in the core: time is the tick counter" },
    { path = "std::time::SystemTime", reason = "no wall clock in the core: time is the tick counter" },
]
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::cos", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::tan", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::asin", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::acos", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::atan", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::atan2", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::sinh", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::cosh", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::tanh", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::hypot", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::exp", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::exp2", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::ln", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::log", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::log2", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::log10", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::powf", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::cbrt", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::mul_add", reason = "fused multiply-add rounds differently from a*b+c: never use it (C-NUM)" },
    { path = "std::time::Instant::now", reason = "no wall clock in the core" },
    { path = "std::time::SystemTime::now", reason = "no wall clock in the core" },
]
