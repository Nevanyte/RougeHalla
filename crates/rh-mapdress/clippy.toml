# docs/adr/0007-determinism.md as a machine check (docs/CONTRACTS.md C-NUM / C-DET). `cargo clippy -D warnings` (CI) refuses:
#  * hash-ordered collections: their iteration order would make serialization, hashing and any loop nondeterministic;
#    use `Vec`, `BTreeMap` or `Store`;
#  * the platform-libm transcendentals of `f64` (results differ between targets): use `crate::math` (the `libm` crate);
#  * the wall clock.
# A sanctioned exception carries `#[allow(clippy::disallowed_methods)]` (or `disallowed_types`) with the reason beside it.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic: use Vec, BTreeMap or Store" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic: use Vec, BTreeSet or Store" },
    { path = "std::time::Instant", reason = "no wall clock in the core: time is the tick counter" },
    { path = "std::time::SystemTime", reason = "no wall clock in the core: time is the tick counter" },
]
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm: use crate::math (libm)" },
    { path = "f64::cos", reason = "platform libm: use crate::math (libm)" },
