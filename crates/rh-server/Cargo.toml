[package]
name = "rh-server"
default-run = "rh-server"
description = "Roguehalla live authoritative match server: WSS, admission, pacing, interest-managed replication, hosting lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Durable results through rh-persist (PostgreSQL). Off by default so the server builds and runs with no database.
postgres = ["dep:rh-persist", "dep:uuid"]
# The benchmarks past the real game: the density benchmark (src/bin/densitybench.rs) runs rooms on a paused tokio clock, which needs
# tokio's test-util, and `wirebench --synthetic N` runs a crowd past the lobby cap (rh-sim's `bench` constructor). Only features of
# existing dependencies (no new crate); a default build of the server carries neither.
bench = ["tokio/test-util", "rh-sim/bench"]

[dependencies]
rh-sim = { path = "../rh-sim" }
rh-protocol = { path = "../rh-protocol" }
rh-policy = { path = "../rh-policy" }
rh-headless = { path = "../rh-headless" }
rh-persist = { path = "../rh-persist", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "densitybench"
path = "src/bin/densitybench.rs"
required-features = ["bench"]

[lints]
workspace = true
