    }
    if (m.t === "welcome") { if (!resume) { P.joinMs = { pageToWelcome: performance.now(), helloToWelcome: performance.now() - P.helloAt }; } else { P.resumeMs = performance.now() - P.helloAt; } P.welcome = { player: m.player, tick: m.tick, mapW: m.map.w, mapH: m.map.h, mapHash: m.map.hash, tickRate: m.tickRate }; session = m.session; map = m.map; if (resume) P.resumes++; }
    else if (m.t === "snapshot") { P.snapshots++; P.lastTick = m.tick; P.me = m.me; P.actors = m.actors; P.phase = m.phase; P.ack = m.ack; }
    else if (m.t === "events") { for (const e of m.events) { P.events.push(e); if (e.k === "result") P.results.push(e); } }
    else if (m.t === "state") { P.stateFrames++; P.collections = Object.fromEntries(tracker.collections); if (awaitingState) { awaitingState = false; P.firstStateAfterWelcome.push(m.items.map(i => i.key)); } }
    else if (m.t === "fx") P.fx += m.fx.length;
    else if (m.t === "pong") P.rtts.push(performance.now() - m.clientMs);
    else if (m.t === "reject") P.rejects.push({ code: m.code, reason: m.reason });
  };
}
function send(bytes) { if (ws && ws.readyState === 1) ws.send(bytes); }
P.move = (x, y) => { P.moveSeq = (P.moveSeq + 1) & 255; send(input(++P.inputSeq, [{ k: "move", x, y, seq: P.moveSeq }])); return P.moveSeq; };
P.cast = (slot, x, y, actorRef = null, t = null, seq = null) => send(input(++P.inputSeq, [{ k: "cast", slot, x, y, actorRef, t, seq }]));
P.choose = (handle,pick) => send(input(++P.inputSeq,[{k:"choose",handle,pick}]));
P.pickup = (handle) => send(input(++P.inputSeq,[{k:"pickup",handle}]));
P.attack = (a) => send(input(++P.inputSeq, [{ k: "attack", a, t: null }]));
P.dropAndResume = () => new Promise((res) => { const old = ws; old.onclose = () => { P.open = false; connect(true).then(res); }; old.close(); });
P.leave = () => send(leave());
P.requestResync = askFull;
// Test hook: forget the snapshot held (as if a delta had been lost), so the next delta is refused and the page asks for a Full one.
P.loseSnapshot = () => { tracker.base = null; };
setInterval(() => send(ping(++nonce)), 500);

// ---- input and drawing ----
const cv = document.getElementById("c"), g = cv.getContext("2d"), st = document.getElementById("s");
const COLORS = [0xff7043, 0x9575cd, 0x9ccc65, 0x4fc3f7, 0xfff176].map((c) => "#" + c.toString(16).padStart(6, "0"));
function view() { if (!P.me || !map) return null; const s = 1; return { s, ox: P.me.x - cv.width / 2 / s, oy: P.me.y - cv.height / 2 / s }; }
cv.addEventListener("mousemove", (e) => { const b = cv.getBoundingClientRect(); mouse = { x: (e.clientX - b.left) * cv.width / b.width, y: (e.clientY - b.top) * cv.height / b.height }; });
cv.addEventListener("mousedown", () => { const v = view(); if (v) P.move(mouse.x / v.s + v.ox, mouse.y / v.s + v.oy); });
addEventListener("keydown", (e) => { if (e.code === "Space") attacking = true; });
addEventListener("keyup", (e) => { if (e.code === "Space") attacking = false; });
setInterval(() => { const v = view(); if (attacking && v) P.attack(Math.atan2(mouse.y / v.s + v.oy - P.me.y, mouse.x / v.s + v.ox - P.me.x)); }, 100);
function draw() {
  const v = view();
  g.fillStyle = "#1b1f2a"; g.fillRect(0, 0, cv.width, cv.height);
  if (v) {
    const T = 32;
    const x0 = Math.max(0, Math.floor(v.ox / T)), y0 = Math.max(0, Math.floor(v.oy / T));
    for (let ty = y0; ty < Math.min(map.h, y0 + cv.height / T + 2); ty++) for (let tx = x0; tx < Math.min(map.w, x0 + cv.width / T + 2); tx++) {
      const t = map.tiles[ty * map.w + tx]; if (t === 0) continue;
      g.fillStyle = t === 1 ? "#4a5068" : "#7a5a3a"; g.fillRect(tx * T - v.ox, ty * T - v.oy, T, T);
    }
    const disc = (a, me) => { const look = remoteActorPresentation(a); g.fillStyle = look.neutral ? "#c7cbd4" : (COLORS[look.faction] || "#ccc"); g.beginPath(); g.arc(a.x - v.ox, a.y - v.oy, 12, 0, Math.PI * 2); g.fill(); if (me) { g.strokeStyle = "#fff"; g.stroke(); } };
    for (const a of P.actors) if (a.status === 1) disc(a, false);
    if (P.me && P.me.status === 1) disc(P.me, true);
  }
  const rtt = P.rtts.slice(-10).sort((a, b) => a - b);
  st.textContent = JSON.stringify({ profile, player: P.welcome && P.welcome.player, tick: P.lastTick, phase: P.phase, hp: P.me && Math.round(P.me.hp), visible: P.actors.length, rttMs: rtt.length ? Math.round(rtt[rtt.length >> 1]) : null, results: P.results, rejects: P.rejects, errors: P.errors });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
connect(false).catch((e) => P.errors.push(String(e)));
</script>
