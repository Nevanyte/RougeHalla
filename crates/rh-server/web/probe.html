// A client's snapshot decoder (mirror of rh-protocol SnapshotTracker): holds the last snapshot applied, the base of the next delta.

    const flush = (limit) => {

        if (di < dep.length && dep[di] < a.id) throw refused("unknown_departed");

      const n = { ...a, id: ch.id };

// ---- probe state (read by automated browser tests through window.__probe) ----
const qs = new URLSearchParams(location.search);
const profile = qs.get("profile") || ("web" + Math.floor(Math.random() * 1e6));
const ticket = qs.get("ticket") || qs.get("token") || "dev";
const faction = qs.has("faction") ? Number(qs.get("faction")) : null;
const P = window.__probe = { welcome: null, stateFrames: 0, firstStateAfterWelcome: [], collections: {}, snapshots: 0, lastTick: 0, me: null, actors: [], events: [], results: [], rejects: [], rtts: [], fx: 0, errors: [], refused: [], fullSnapshots: 0, deltaSnapshots: 0, resyncs: 0, firstSnapshotAfterWelcome: [], resumes: 0, inputSeq: 0, moveSeq: 0, open: false };

async function connect(resume) {

    contentHash = BigInt("0x" + info.contentHash);

  ws.binaryType = "arraybuffer";
  ws.onopen = () => { P.open = true; P.helloAt = performance.now(); ws.send(hello(contentHash, profile, ticket, faction, resume ? session : null)); };
  ws.onclose = () => { P.open = false; };
  ws.onerror = () => P.errors.push("socket error");
  ws.onmessage = (ev) => {
    if (protocolRejected) return;

      if (e.protocolMismatch) { protocolRejected = true; P.rejects.push({ code: 1, reason: e.message }); ws.close(); return; }

      // comes; ask again only if it is RESYNC_RETRY_MS late (the server never drops a request: this covers a lost one).
      if (e.code || tag === 0x87) { P.refused.push(String(e.message)); if (!needFull || performance.now() - resyncAt >= RESYNC_RETRY_MS) askFull(); }

    else if (m.t === "snapshot") { P.snapshots++; P.lastTick = m.tick; P.me = m.me; P.actors = m.actors; P.phase = m.phase; P.ack = m.ack; }
    else if (m.t === "events") { for (const e of m.events) { P.events.push(e); if (e.k === "result") P.results.push(e); } }

function send(bytes) { if (ws && ws.readyState === 1) ws.send(bytes); }
P.move = (x, y) => { P.moveSeq = (P.moveSeq + 1) & 255; send(input(++P.inputSeq, [{ k: "move", x, y, seq: P.moveSeq }])); return P.moveSeq; };

// ---- input and drawing ----
const cv = document.getElementById("c"), g = cv.getContext("2d"), st = document.getElementById("s");
const COLORS = [0xff7043, 0x9575cd, 0x9ccc65, 0x4fc3f7, 0xfff176].map((c) => "#" + c.toString(16).padStart(6, "0"));

cv.addEventListener("mousemove", (e) => { const b = cv.getBoundingClientRect(); mouse = { x: (e.clientX - b.left) * cv.width / b.width, y: (e.clientY - b.top) * cv.height / b.height }; });
cv.addEventListener("mousedown", () => { const v = view(); if (v) P.move(mouse.x / v.s + v.ox, mouse.y / v.s + v.oy); });

  const v = view();
  g.fillStyle = "#1b1f2a"; g.fillRect(0, 0, cv.width, cv.height);

    const T = 32;
    const x0 = Math.max(0, Math.floor(v.ox / T)), y0 = Math.max(0, Math.floor(v.oy / T));

}
requestAnimationFrame(draw);
connect(false).catch((e) => P.errors.push(String(e)));
</script>
