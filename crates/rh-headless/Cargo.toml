[package]
name = "rh-headless"
default-run = "rh-headless"
description = "Headless runner: the same Sim and the same policy seats as the live server, with no waits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rh-sim = { path = "../rh-sim" }
rh-policy = { path = "../rh-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "rh-headless"
path = "src/main.rs"

[[bin]]
name = "scalebench"
path = "src/bin/scalebench.rs"
required-features = ["bench"]

[features]
# Builds scalebench: N fighters past MAX_PLAYERS (rh-sim's `bench` constructor).
bench = ["rh-sim/bench"]

[lints]
workspace = true
