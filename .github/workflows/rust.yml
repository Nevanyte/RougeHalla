# PRIVATE BRANCH DIAGNOSTIC ONLY — NEVER MERGE THIS WORKFLOW REPLACEMENT TO MAIN.
name: Allocation isolation diagnostic ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  allocation-diagnostic:
    name: DIAGNOSTIC ONLY - original CI red remains open
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Record runtime setup
        run: |
          mkdir -p allocation-diagnostic
          dotnet --info > allocation-diagnostic/dotnet-info.log
          git rev-parse HEAD > allocation-diagnostic/head.txt
          git diff 986f44dfd9a61eb769700adc476fc8b9e9aa8011 -- client-unity/RoguehallaNet > allocation-diagnostic/decoder-diff.txt
      - name: Restore diagnostic and existing test dependencies
        run: dotnet restore tools/csharp-allocation-diagnostic/AllocationProbe.csproj
      - name: Run unchanged allocation selectors and isolation controls
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test client-unity/RoguehallaNet.Tests --no-restore --filter 'FullyQualifiedName~GarbageTests|FullyQualifiedName~AllocationMeasurementTests' --logger 'console;verbosity=normal' 2>&1 | tee allocation-diagnostic/focused-tests.log
      - name: Record original and isolated actual-decoder distributions
        if: always()
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          probe_status=0
          dotnet run --no-restore --project tools/csharp-allocation-diagnostic -- --output "$RUNNER_TEMP/allocation-probe" 2>&1 | tee allocation-diagnostic/probe.log || probe_status=$?
          if test -d "$RUNNER_TEMP/allocation-probe"; then cp -R "$RUNNER_TEMP/allocation-probe" allocation-diagnostic/probe; fi
          exit "$probe_status"
      - name: Retain exact step outcomes
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: printf 'focused=%s\nprobe=%s\n' "$FOCUSED_OUTCOME" "$PROBE_OUTCOME" > allocation-diagnostic/outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocation-isolation-DIAGNOSTIC-ONLY
          path: allocation-diagnostic
          retention-days: 7
      - name: Keep real diagnostic failures red
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: test "$FOCUSED_OUTCOME" = success && test "$PROBE_OUTCOME" = success
