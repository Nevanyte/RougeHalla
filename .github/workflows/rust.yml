# Rust foundation CI: builds and tests with no Unity and no AWS. The legacy TypeScript game keeps its own manual deploy
# workflow (deploy.yml); this one never deploys anything.
name: Rust foundation

on:
  push:
    branches: [main, optimization_port]
    paths: ["crates/**", "protocol/**", "parity/**", "maps/**", "packages/shared/src/**", "packages/server/src/**", "package.json", "package-lock.json", "client-unity/RoguehallaNet/**", "client-unity/RoguehallaNet.Tests/**", "tools/**", "Cargo.*", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "protocol/**", "parity/**", "maps/**", "packages/shared/src/**", "packages/server/src/**", "package.json", "package-lock.json", "client-unity/**", "tools/**", "Cargo.*", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Check the accepted source/harness/protected-pin chain before starting expensive native/source campaigns.
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Accepted card provenance chain is current and unchanged
        run: node tools/provenance/check-card-chain.mjs

  # Keep the complete pure-simulation suite independent of transport/PG/source recapture work. The default workspace
  # suite passed 1,520 tests at b01fc9e2, but consumed 31 minutes of the old job's cumulative 40-minute allowance.
  simulation:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: simulation
      # rh-headless/rh-parity dev dependencies enable these in the former workspace invocation. Preserve that union,
      # including the required-feature privacy/allocation targets, when selecting rh-sim in its own job.
      - name: Complete workspace-unified simulation suite, including map generators and documentation
        run: cargo test --locked -p rh-sim --features trusted-status-probes

  rust:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: always
      # Symbols are unnecessary for these assertion/source gates and greatly enlarge repeated feature builds.
      # Optimization levels, debug assertions, overflow checks and the complete test selection remain unchanged.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Standalone map benchmark builds without Unity or AWS
        run: |
          cargo fmt --manifest-path tools/map-bench/Cargo.toml -- --check
          cargo check --locked --manifest-path tools/map-bench/Cargo.toml --target-dir "$RUNNER_TEMP/map-bench-target"
      - name: Remaining default workspace tests (full rh-sim suite runs in the simulation job)
        run: cargo test --locked --workspace --exclude rh-sim
      - name: Server with the durable store (every PostgreSQL-backed server test, incl. pg_e2e and the lease conformance suite)
        run: cargo test -p rh-server --features postgres
      - name: Durable placement ownership and process recovery (real PostgreSQL and persistent fake)
        run: cargo test --locked -p rh-placement --features postgres,fault-injection
      - name: Parity report (Rust vs captured legacy scenarios)
        run: cargo run -p rh-parity --bin parity-report
      - name: Headless smoke (real 160x160 map, 8 bots)
        run: cargo run --release -p rh-headless -- --matches 4 --players 8 --map parity/maps/seed1.map.json --max-ticks 4000
      - name: Headless smoke (full gameplay map layers, 8 bots)
        run: cargo run --release -p rh-headless -- --matches 1 --players 8 --map crates/rh-sim/src/mapdata/fixtures/seed1.map.json --max-ticks 4000
      - name: JS probe decoder vs the golden vectors
        run: |
          node tools/protocol-js/check-vectors.mjs
          node tools/protocol-js/check-first-playable.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - run: npm ci
      - name: Composed bot, quest, trade, telemetry and fair-view witnesses remain byte exact
        run: |
          bash tools/bot-addbot-fixtures/capture.sh --check
          bash tools/trade-fixtures/capture.sh --check
          bash tools/quest-fixtures/capture.sh --check
          bash tools/bot-tournament-fixtures/capture.sh --check
          bash tools/bot-telemetry-fixtures/capture.sh --check
          bash tools/bot-fight-fixtures/capture.sh --check
          bash tools/percept-witness-fixtures/capture.sh --check
          bash tools/barrier-view-fixtures/capture.sh --check
      - name: Heal-barrier callers and victim Frost resistance remain source exact
        run: |
          bash tools/heal-barrier-fixtures/capture.sh --check
          bash tools/heal-barrier-callers/capture.sh --check
          bash tools/frost-resistance-fixtures/capture.sh --check
          bash tools/mark-rate-fixtures/capture.sh --check
      - name: Bounded Frost NPC recipients, weapon draws and return paths remain source exact
        run: |
          bash tools/frost-npc-fixtures/capture.sh --check
          bash tools/frost-npc-fixtures/capture-boundary.sh --check
          bash tools/frost-npc-fixtures/capture-return.sh --check
      - name: Human Wish and Trophy source witnesses remain byte exact
        run: |
          bash tools/wish-public-fixtures/capture.sh --check
          bash tools/trophy-witness-fixtures/capture.sh --check
          bash tools/trophy-format-fixtures/capture.sh --check
      - name: Human quest and trader doors, schema and receivers remain source exact
        run: |
          bash tools/quest-public-fixtures/capture.sh --check
          bash tools/quest-notice-fixtures/capture.sh --check
          bash tools/trade-public-fixtures/capture.sh --check
      - name: First-playable cards, constructor, potions and PvE still match the actual source
        run: |
          bash tools/cards-fixtures/capture.sh --check
          bash tools/initial-world-fixtures/capture.sh --check
          bash tools/initial-loot-fixtures/capture.sh --check
          bash tools/pve-dot/capture.sh --check
      - name: Pure stat fold still matches the actual source
        run: |
          node --import tsx tools/stat-fold/capture.ts --preset canonical --check
          node --import tsx --test tools/stat-fold/run.test.ts
          node --import tsx tools/stat-fold/run.ts ci
      - name: Complete card catalog and reward selection still match the actual source
        run: bash tools/card-catalog-fixtures/capture.sh --check
      - name: Terrain player and source-born NPC witnesses remain byte exact
        run: |
          bash tools/terrain-fixtures/capture.sh --check
          bash tools/terrain-fixtures/born-capture.sh --check
      - name: Bounded terrain kernel and collision allocation checks
        run: |
          cargo test --locked -p rh-sim --features trusted-status-probes --lib terrain
          cargo test --locked -p rh-sim --features trusted-status-probes --test terrain_no_alloc
      - name: Planning and arena source witnesses remain byte exact
        run: bash tools/arena-fixtures/capture.sh --check
      - name: All five Wish source witnesses remain byte exact
        run: |
          bash tools/ability-fixtures/capture.sh --check
          bash tools/ability-void-fixtures/capture.sh --check
          bash tools/ability-overlap-fixtures/capture.sh --check
          bash tools/ability-refund-fixtures/capture.sh --check
      - name: Bounded native Wishes retain source behavior and warmed allocations
        run: |
          cargo test --locked -p rh-sim --features trusted-status-probes,schedule-trace --lib abilities::
          cargo test --locked -p rh-sim --features trusted-status-probes --test abilities_no_alloc
      - name: Pure mob catalog and rosters still match the actual source
        run: node --import tsx tools/mob-fixtures/catalog-rosters.ts --self-test
      - name: Status runtime matches all four frozen source corpora
        run: |
          cargo run --locked -p rh-parity --features trusted-status-probes --bin status-probes -- parity/status/helpers.json
          cargo run --locked -p rh-parity --features trusted-status-probes --bin status-probes -- parity/status/runtime.json
          cargo run --locked -p rh-parity --features trusted-status-probes --bin status-probes -- parity/status/refinements-v2.json
          cargo run --locked -p rh-parity --features trusted-status-probes --bin status-probes -- parity/status/boundaries-v3.json
          cargo test --locked -p rh-sim --features trusted-status-probes --test status_privacy_review --test status_alloc_review --test status_no_alloc
      - name: Status source corpora and nested admission remain exact
        run: |
          node --import tsx tools/status-fixtures/argv-controls.ts
          node --import tsx tools/status-fixtures/capture.ts --check
          node --import tsx tools/status-fixtures/capture.ts --slice=runtime --check
          node --import tsx tools/status-fixtures/refinements.ts --check
          node --import tsx tools/status-fixtures/capture-v3.ts --check
          python3 tools/status-fixtures/strict-admission-v2.py parity/status/helpers.json parity/status/runtime.json parity/status/refinements-v2.json
          python3 tools/status-fixtures/validate-v3.py parity/status/boundaries-v3.json
      - name: Durable achievement rules still match the legacy evaluator
        run: node --import tsx tools/persist-fixtures/achievements.ts --check
      - name: Shop catalog and validated look words still match the legacy reference
        run: node --import tsx tools/persist-fixtures/cosmetics.ts --check
      - name: Ending metadata still matches the legacy room and store
        run: node --import tsx tools/persist-fixtures/ending-metadata.ts --check
      - name: Plague ledger and hidden-history proofs still match the actual source
        run: |
          node --import tsx tools/plague-fixtures/ledger-matrix.ts "$RUNNER_TEMP/plague-ledger.json"
          cmp parity/plague/ledger-matrix.json "$RUNNER_TEMP/plague-ledger.json"
          node --import tsx tools/plague-fixtures/hidden-history.ts "$RUNNER_TEMP/plague-hidden.json" > "$RUNNER_TEMP/plague-hidden.log"
          cmp parity/plague/hidden-history.json "$RUNNER_TEMP/plague-hidden.json"
      - name: Fire ledger and hidden-instant proofs still match the actual source
        run: |
          node --import tsx tools/fire-fixtures/ledger-matrix.ts "$RUNNER_TEMP/fire-ledger.json"
          cmp parity/fire/ledger-matrix.json "$RUNNER_TEMP/fire-ledger.json"
          node --import tsx tools/fire-fixtures/hidden-instant.ts "$RUNNER_TEMP/fire-hidden.json" > "$RUNNER_TEMP/fire-hidden.log"
          cmp parity/fire/hidden-instant.json "$RUNNER_TEMP/fire-hidden.json"
      - name: Frost helpers and installed runtime still match the actual source
        run: |
          node --import tsx tools/frost-fixtures/helpers.ts "$RUNNER_TEMP/frost-helpers.json"
          cmp parity/frost/helpers.json "$RUNNER_TEMP/frost-helpers.json"
          node --import tsx tools/frost-fixtures/runtime-matrix.ts "$RUNNER_TEMP/frost-runtime.json"
          cmp parity/frost/runtime-matrix.json "$RUNNER_TEMP/frost-runtime.json"
          node --import tsx tools/frost-fixtures/ranged-ledger.ts "$RUNNER_TEMP/frost-ranged.json"
          cmp parity/frost/ranged-ledger.json "$RUNNER_TEMP/frost-ranged.json"
      - name: Sentenced runtime, denial and public proofs still match the actual source
        run: |
          node --import tsx tools/sentenced-fixtures/runtime-matrix.ts "$RUNNER_TEMP/sentenced-runtime.json"
          cmp parity/sentenced/runtime-matrix.json "$RUNNER_TEMP/sentenced-runtime.json"
          node --import tsx tools/sentenced-fixtures/denial-matrix.ts "$RUNNER_TEMP/sentenced-denial.json"
          cmp parity/sentenced/denial-matrix.json "$RUNNER_TEMP/sentenced-denial.json"
          node --import tsx tools/sentenced-fixtures/public-pairs.ts "$RUNNER_TEMP/sentenced-public.json" > "$RUNNER_TEMP/sentenced-public.log"
          cmp parity/sentenced/public-pairs.json "$RUNNER_TEMP/sentenced-public.json"
          node --import tsx tools/sentenced-fixtures/hidden-history-pair.ts "$RUNNER_TEMP/sentenced-history.json" > "$RUNNER_TEMP/sentenced-history.log"
          cmp parity/sentenced/hidden-history-pair.json "$RUNNER_TEMP/sentenced-history.json"
      - name: Map foundations still match the legacy reference
        run: node --import tsx tools/map-fixtures/foundations.ts --check
      - name: Full map exports still match the legacy reference
        run: node --import tsx tools/map-fixtures/full-map.ts --check
      - name: Zone partitions still match the legacy reference
        run: node --import tsx tools/map-fixtures/zones-partition.ts --check
      - name: Initial camps and territories still match the legacy reference
        run: node --import tsx tools/map-fixtures/zones-camps.ts --check
      - name: Attempt prefixes still match the actual legacy generator
        run: node --import tsx tools/map-fixtures/attempt-frame.ts --check
      - name: Spawn stages still match the actual legacy generator
        run: node --import tsx tools/map-fixtures/spawns.ts --check
      - name: Elite bushes still match the actual legacy generator
        run: node --import tsx tools/map-fixtures/bushes.ts --check
      - name: Whole-wall landmark runtime still matches the actual legacy generator
        run: node --import tsx tools/map-fixtures/landmark-runtime.ts --check
      - name: Landmark templates and stamps still match the actual legacy generator
        run: node --import tsx tools/map-fixtures/landmark-templates.ts --check
      - name: Landmark search and scoped cache still match the actual legacy generator
        run: node --import tsx tools/map-fixtures/landmark-search.ts --check
      - name: Landmark recipe support still matches the actual legacy helpers
        run: node --import tsx tools/map-fixtures/landmark-support.ts --check
      - name: Scorch and Gallows recipes still match the actual legacy callbacks
        run: node --import tsx tools/map-fixtures/landmark-recipes-search.ts --check
      - name: Rime Sanctum and Warren recipes still match the actual legacy callbacks
        run: node --import tsx tools/map-fixtures/landmark-recipes-direct.ts --check
      - name: Ordered landmark admission and masks still match the actual generator
        run: node --import tsx tools/map-fixtures/landmark-stage.ts --check
      - name: Final map records still match the actual generator
        run: node --import tsx tools/map-fixtures/records.ts --check
      - name: Camp crate and ground placement still match the actual generator
        run: node --import tsx tools/map-fixtures/spots.ts --check
      - name: Crate ownership preserves source Uint16 IDs
        run: node --import tsx tools/map-fixtures/spots-owner-width.ts --check
      - name: Safety nets and territory repair still match the actual generator
        run: node --import tsx tools/map-fixtures/repair.ts --check
      - name: Terrain cleanup loot decor and final shape gate still match the actual generator
        run: node --import tsx tools/map-fixtures/tail.ts --check
      - name: Ordered terrain validation still matches the actual source
        run: node --import tsx tools/map-fixtures/terrain-gate.ts --check
      - name: Exact map hash and Number strings still match the actual source
        run: node --import tsx tools/map-fixtures/map-hash.ts --check
      - name: Independent hard-map certificate still matches the actual source
        run: node --import tsx tools/map-fixtures/certify.ts --check
      - name: Stage-six guarded runtime still matches the actual source
        run: node --import tsx tools/map-fixtures/style-runtime.ts --check
      - name: Style feature search and geometry still match the actual source
        run: node --import tsx tools/map-fixtures/style-features.ts --check
      - name: Holy style callbacks still match the actual source
        run: node --import tsx tools/map-fixtures/style-sanctum.ts --check
      - name: Warren style callbacks still match the actual source
        run: node --import tsx tools/map-fixtures/style-warren.ts --check
      - name: Scorch style callbacks still match the actual source
        run: node --import tsx tools/map-fixtures/style-scorch.ts --check
      - name: Rime style callbacks still match the actual source
        run: node --import tsx tools/map-fixtures/style-rime.ts --check
      - name: Gallows style callbacks still match the actual source
        run: node --import tsx tools/map-fixtures/style-gallows.ts --check
      - name: Generator style contract and original pool hazards still match the actual source
        run: node --import tsx tools/map-fixtures/style-contract.ts --check
      - name: Styled attempt streams options and retry wrappers still match the actual source
        run: node --import tsx tools/map-fixtures/styled-controls.ts --check
      - name: Five-faction dispatch and original OPEN pins still match the actual source
        run: node --import tsx tools/map-fixtures/styled-open.ts --check
      - name: Complete styled pipeline and original pins still match the actual source
        run: node --import tsx tools/map-fixtures/styled-pipeline.ts --check
      - name: Complete plain pipeline and original pins still match the actual source
        run: node --import tsx tools/map-fixtures/plain-pipeline.ts --check
      - name: Browser proof (Chromium over WSS)
        run: |
          cargo build -p rh-server
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/browser-proof/proof.mjs

  card-runtime-source:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Actual card runtime and positive Witness remain byte exact
        run: |
          mkdir -p node_modules
          bash tools/card-runtime-fixtures/capture.sh --check
          bash tools/card-runtime-witness-fixtures/capture.sh --check

  csharp:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test client-unity/RoguehallaNet.Tests
      - name: Unity copy of the library is up to date
        run: bash client-unity/sync-net.sh --check
